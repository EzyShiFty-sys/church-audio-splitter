[project]
name = "church-audio-splitter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
church-audio-splitter = "church_audio_splitter:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
